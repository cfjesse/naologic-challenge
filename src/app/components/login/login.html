<div class="login-wrapper">
  <!-- Theme Toggle in Corner -->
  <div class="login-theme-toggle">
    <button type="button" class="btn-theme-toggle" (click)="toggleTheme()" [title]="isDarkMode() ? 'Switch to Light theme' : 'Switch to Dark theme'">
      @if (isDarkMode()) {
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="theme-text">Light</span>
      } @else {
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span class="theme-text">Dark</span>
      }
    </button>
  </div>

  <div class="login-card">
    <div class="login-header">
      <div class="brand">NAO<span class="brand-accent">LOGIC</span></div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Enter your credentials to access the ERP</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input type="text" id="username" name="username" class="form-control" [(ngModel)]="username" required autofocus
            placeholder="admin or user">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password" required
            placeholder="admin or user">
        </div>
      </div>

      @if (error()) {
      <div class="error-message">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error() }}</span>
      </div>
      }

      <button type="submit" class="btn-login" [disabled]="loading() || !loginForm.form.valid">
        @if (loading()) {
        <span class="spinner"></span> Logging in...
        } @else {
        Log In
        }
      </button>

      <div class="demo-credentials">
        <span class="hint-label">Demo Credentials (Click to fill):</span>
        <div class="hint-badges">
          <button type="button" class="btn-hint-badge" (click)="setCredentials('admin', 'admin')">
            <strong>admin</strong> / admin
          </button>
          <button type="button" class="btn-hint-badge" (click)="setCredentials('user', 'user')">
            <strong>user</strong> / user
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
